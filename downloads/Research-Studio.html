10px;padding:17px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}input,select,textarea{font:inherit;border:1px solid #dfe5df;border-radius:7px;padding:10px;background:#fff;color:var(--ink)}.toolbar input{min-width:260px}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap;font-size:12px}th{background:#fafbf9;color:#8b958e;font-weight:500;padding:14px 18px;border-bottom:1px solid var(--line)}td{padding:17px 18px;border-bottom:1px solid #f0f2ee;max-width:250px;overflow:hidden;text-overflow:ellipsis}td button{font-size:11px;padding:5px 9px}tbody tr:hover{background:#fcfdf9}.scroll{overflow:auto}.table-bottom{padding:17px 20px;color:#9aa29d;font-size:11px;display:flex;justify-content:space-between}.empty{text-align:center;padding:42px 25px;color:#96a095;line-height:2}.note{background:#fffbef;color:#978553;border:1px solid #f3eaca;padding:14px 18px;font-size:12px;border-radius:8px;margin-bottom:20px;line-height:1.8}.task{padding:17px 22px;display:flex;gap:13px;align-items:center;border-bottom:1px solid var(--line)}.task input{accent-color:var(--green);width:17px;height:17px}.task.done .task-name{text-decoration:line-through;color:#9da69e}.task small{line-height:1.7}.task button{margin-left:auto}.task-form{display:flex;gap:10px;margin-bottom:20px}.task-form input:first-child{flex:1}footer{font-size:11px;color:#a4ada6;padding:15px 38px;border-top:1px solid var(--line)}footer span{float:right}dialog{width:780px;max-width:94vw;border:1px solid #e1e8df;border-radius:16px;padding:0;box-shadow:0 20px 100px #172b2430}dialog::backdrop{background:#18282066}.modal-top,.modal-bottom{padding:18px 24px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}.modal-top{justify-content:space-between}.modal-top h2{font-size:19px}.modal-bottom{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line)}.modal-bottom span{margin-right:auto;color:#8d998f;font-size:11px}#fields{padding:20px 24px;display:grid;grid-template-co const STORAGE_KEY='shin-research-offline-v1';
let offlineData;
try { const old=localStorage.getItem(STORAGE_KEY);offlineData=old?JSON.parse(old):{"terms": [{"id": "CSI-001", "category": "生态文化负载词", "word": "西山", "reason": "北京西郊山地的地方称谓，联系进香和运输路线；普通地名是否纳入需复核。", "human": "la colline de l’Ouest", "chatgpt": "", "deepseek": "", "subtype": "地方山地", "status": "排除", "chapter": "1", "chapters": "1、2、4、5、11、16、23、24", "context": "…环境与知识的特异，又使一部分车夫另成派别。生于西苑海甸的自然以走西山，燕京，清华，较比方便；同样，在安定门外的走清河，北苑；在永定门外的走南苑……这是跑长趟的…", "french": "Ceux qui habitent près du quartier de Si-yuan, à l’ouest, ou de Hai-tian, s’arrangent naturellement pour faire les courses jusqu’à la colline de l’Ouest, à Yan-king ou à Ts’ing-houa.", "position": "第1章·第6段", "hits": "9", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第1章·第6段（EPUB正文段序，非页码）"}, {"id": "CSI-002", "category": "生态文化负载词", "word": "玉泉山", "reason": "北京地方山水专名，兼具历史游览背景；仅作路线指称时文化负载较弱。", "human": "la colline de Yu-K’iuan", "chatgpt": "", "deepseek": "", "subtype": "地方山水", "status": "排除", "chapter": "1", "chapters": "1", "context": "…如东交民巷的车夫的气儿长，这些专拉洋买卖的讲究一气儿由交民巷拉到玉泉山，颐和园或西山。气长也还算小事，一般车夫万不能争这项生意的原因，大半还是因为这些吃洋饭的有…", "french": "Ceux-là se font un honneur de conduire d’une seule traite les clients étrangers de Tong-kiao-min-hiang à la colline de Yu-K’iuan, au jardin Yi-ho ou même à la colline de l’Ouest.", "position": "第1章·第6段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第1章·第6段（EPUB正文段序，非页码）"}, {"id": "CSI-003", "category": "生态文化负载词", "word": "万寿山", "reason": "园林山体专名，与北京历史游览空间有关；须区分山体与园林文化。", "human": "Wancheou-chan", "chatgpt": "", "deepseek": "", "subtype": "地方山水", "status": "排除", "chapter": "1", "chapters": "1", "context": "…洋饭的有点与众不同的知识，他们会说外国话。英国兵，法国兵，所说的万寿山，雍和宫，“八大胡同”，他们都晓得。他们自己有一套外国话，不传授给别人。他们的跑法也特别，…", "french": "D’autre part, ils sont les seuls à comprendre la prononciation affreuse des soldats anglais ou français, lorsqu’ils mâchonnent des noms de lieux comme Wancheou-chan, Yong-ho-kong, Pa-ta-hou-t’ong, etc.", "position": "第1章·第6段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第1章·第6段（EPUB正文段序，非页码）"}, {"id": "CSI-004", "category": "生态文化负载词", "word": "春麦", "reason": "联系北方农时、粮荒和战争叙述，单独词义未必文化特有。", "human": "les blés qui poussaient", "chatgpt": "", "deepseek": "", "subtype": "农事环境", "status": "待复核", "chapter": "2", "chapters": "2、17", "context": "战争的消息与谣言几乎每年随着春麦一块儿往起长，麦穗与刺刀可以算作北方人的希望与忧惧的象征。祥子的新车刚交半岁的时候，正是麦…", "french": "Chaque année, au printemps, les nouvelles du conflit provoqué par les Seigneurs de Guerre de tout acabit se répandaient comme les blés qui poussaient.", "position": "第2章·第6段", "hits": "2", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第2章·第6段（EPUB正文段序，非页码）"}, {"id": "CSI-005", "category": "生态文化负载词", "word": "金顶山", "reason": "小说逃亡路线中的山地专名；是否具有超出地理定位的文化信息需复核。", "human": "Tsin-ting-chan", "chatgpt": "", "deepseek": "", "subtype": "地方山地", "status": "初步纳入", "chapter": "2", "chapters": "2", "context": "…地图；这里是磨石口——老天爷，这必须是磨石口！——他往东北拐，过金顶山，礼王坟，就是八大处；从四平台往东奔杏子口，就到了南辛庄。为是有些遮隐，他顶好还顺着山走，…", "french": "Il voyait clairement son itinéraire : de là, il allait tourner vers le nord-est, traverser Tsin-ting-chan, Li-wang-fen, et il se retrouverait à Pa-ta-tch’ou.", "position": "第2章·第23段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第2章·第39段（EPUB正文段序，非页码）"}, {"id": "CSI-006", "category": "生态文化负载词", "word": "南河滩", "reason": "地方地形专名，指示京西逃亡路线；仅具定位作用时可排除。", "human": "Nan-ho-t’an", "chatgpt": "", "deepseek": "", "subtype": "地方地貌", "status": "排除", "chapter": "2", "chapters": "2", "context": "…是有些遮隐，他顶好还顺着山走，从北辛庄，往北，过魏家村；往北，过南河滩；再往北，到红山头，杰王府；静宜园了！找到静宜园，闭着眼他也可以摸到海甸去！他的心要跳出来…", "french": "Puis, de Peihing-tchouang, il se dirigerait vers le nord, passerait par Wei-tsia-ts’ouen et, toujours vers le nord, traverserait Nan-ho-t’an, Hang-chang-t’eou, Tsie-wang-fou, et parviendrait enfin au jardin Tsing-yi.", "position": "第2章·第23段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第2章·第39段（EPUB正文段序，非页码）"}, {"id": "CSI-007", "category": "生态文化负载词", "word": "西口", "reason": "关口及其外部交通地域的称呼，需联系原文骆驼运输语境辨义。", "human": "Si-k’eou", "chatgpt": "", "deepseek": "", "subtype": "地域概念", "status": "初步纳入", "chapter": "3", "chapters": "3", "context": "“啊！骆驼出西口没什么险啦吧？”", "french": "— Tu n’as pas eu de mal à sortir de Si-k’eou ?", "position": "第3章·第26段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第3章·第39段（EPUB正文段序，非页码）"}, {"id": "CSI-008", "category": "生态文化负载词", "word": "口外", "reason": "旧时以关口内外划分地域，涉及北方放牧与骆驼贸易的空间观念。", "human": "au-delà de Si-k’eou", "chatgpt": "", "deepseek": "", "subtype": "地域概念", "status": "初步纳入", "chapter": "3", "chapters": "3", "context": "…呆的看着那四匹牲口。待了半天：“前几天本想和街坊搭伙，把它们送到口外去放青。东也闹兵，西也闹兵，谁敢走啊！在家里拉夏吧，看着就焦心，看着就焦心，瞧这些苍蝇！赶…", "french": "— Vois-tu, pas plus tard qu’avant-hier, j’ai voulu réunir quelques hommes pour emmener ces bêtes paître au-delà de Si-k’eou.", "position": "第3章·第31段", "hits": "2", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第3章·第48段（EPUB正文段序，非页码）"}, {"id": "CSI-009", "category": "生态文化负载词", "word": "天河", "reason": "银河的传统称谓，带有汉语天象命名色彩；本处未明示神话，宜复核。", "human": "〔本处未见独立对应〕", "chatgpt": "", "deepseek": "", "subtype": "传统天象称谓", "status": "排除", "chapter": "6", "chapters": "6", "context": "初秋的夜晚，星光叶影里阵阵的小风，祥子抬起头，看着高远的天河，叹了口气。这么凉爽的天，他的胸脯又是那么宽，可是他觉到空气仿佛不够，胸中非常憋闷。他想坐…", "french": "〔词／句级对应未确立，见“对齐说明”〕", "position": "第6章·第1段", "hits": "1", "alignment": "本章开头夜空、天河描写未见对应句。 未见对应不等于译者省译定论，需结合中文底本版本另考。", "source": "法文第6章；本处未确立对应"}, {"id": "CSI-010", "category": "生态文化负载词", "word": "三海", "reason": "北京特定湖泊群的合称，不宜逐字理解为三个海洋。", "human": "San-hai", "chatgpt": "", "deepseek": "", "subtype": "地方水域", "status": "初步纳入", "chapter": "9", "chapters": "9", "context": "…得微茫；白塔却高耸到云间，傻白傻白的把一切都带得冷寂萧索，整个的三海在人工的雕琢中显出北地的荒寒。到了桥头上，两面冰上的冷气使祥子哆嗦了一下，他不愿再走。平日…", "french": "Tout ce quartier de San-hai, endormi et comme écrasé par la splendeur du passé, symbolisait la solitude du Nord.", "position": "第9章·第33段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第9章·第49段（EPUB正文段序，非页码）"}, {"id": "CSI-011", "category": "生态文化负载词", "word": "立秋", "reason": "二十四节气名称，兼具季候划分与中国传统历法信息。", "human": "Aux environs du premier jour d’automne", "chatgpt": "", "deepseek": "", "subtype": "节气", "status": "初步纳入", "chapter": "20", "chapters": "20", "context": "快到立秋，他又拉上了包月。这回，比以前所混过的宅门里的事都轻闲；要不是这样，他就不会应下这个事来。…", "french": "Aux environs du premier jour d’automne, il trouva un emploi chez un particulier.", "position": "第20章·第45段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第20章·第61段（EPUB正文段序，非页码）"}, {"id": "CSI-012", "category": "生态文化负载词", "word": "积水滩", "reason": "北京地方水域名称，兼有城市历史空间信息，是否纳入取决于语境。", "human": "〔本处未见独立对应〕", "chatgpt": "", "deepseek": "", "subtype": "地方水域", "status": "初步纳入", "chapter": "24", "chapters": "24", "context": "…漂亮的摆出去，而且显明的露出身上的曲线。好清静的人们也有了去处，积水滩前，万寿寺外，东郊的窑坑，西郊的白石桥，都可以垂钓，小鱼时时碰得嫩苇微微的动。钓完鱼，野茶…", "french": "〔词／句级对应未确立，见“对齐说明”〕", "position": "第24章·第4段", "hits": "2", "alignment": "首次出现处的游览、垂钓段落在所供法文版本中未见对应。 未见对应不等于译者省译定论，需结合中文底本版本另考。", "source": "法文第24章；本处未确立对应"}, {"id": "CSI-013", "category": "物质文化负载词", "word": "洋车", "reason": "旧北京人力车的历史称谓，承载城市交通与车夫劳动生活背景。", "human": "pousse-pousse", "chatgpt": "", "deepseek": "", "subtype": "交通器物", "status": "初步纳入", "chapter": "1", "chapters": "1、2、3、4、8、9、11、15、22、24", "context": "北平的洋车夫有许多派：年轻力壮，腿脚灵利的，讲究赁漂亮的车，拉“整天儿”，爱什么时候出车与收车都有自…", "french": "Commençons donc par présenter Siang-tse le tireur de pousse-pousse, et nous évoquerons, en passant, son aventure avec les chameaux qui lui valurent ce surnom.", "position": "第1章·第2段", "hits": "27", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第1章·第1段（EPUB正文段序，非页码）"}, {"id": "CSI-014", "category": "物质文化负载词", "word": "窝窝头", "reason": "传统粗粮蒸食，关联底层车夫的日常饮食。", "human": "〔本处未见独立对应〕", "chatgpt": "", "deepseek": "", "subtype": "地方饮食", "status": "初步纳入", "chapter": "1", "chapters": "1、6、16", "context": "…，上了这条到 ers": "15", "context": "…又穿上平日的棉裤棉袄，头上可是戴着一小朵绒作的红花，花上还有个小金纸的元宝。祥子看了她一眼，她不像个新妇。她的一举一动都像个多年的媳妇，麻利，老到，还带着点自得的劲…", "french": "Elle avait agrémenté ses cheveux d’une fleur rouge en velours avec un cœur en papier doré.", "position": "第15章·第22段", "hits": "1", "alignment": "原译用花心代替元宝形制。", "source": "Le Pousse-pousse，法文第15章·第30段（EPUB正文段序，非页码）"}, {"id": "CSI-091", "category": "物质文化负载词", "word": "炕", "reason": "兼具取暖与睡卧功能的北方传统居住设施。", "human": "le lit", "chatgpt": "", "deepseek": "", "subtype": "北方住居", "status": "初步纳入", "chapter": "15", "chapters": "15、16、17、18、19、20、22、23", "context": "吃完饭，他躺在了炕上，头枕着手心，眼看着棚顶。", "french": "Après le repas, il s’étendit sur le lit, en croisant les mains sous sa tête.", "position": "第15章·第29段", "hits": "23", "alignment": "首次炕的传统供暖功能未说明；后文另有kang音译。", "source": "Le Pousse-pousse，法文第15章·第35段（EPUB正文段序，非页码）"}, {"id": "CSI-092", "category": "物质文化负载词", "word": "元宵", "reason": "以糯米等加工的传统节令圆食；本条仅取食物义，元宵节另列社会文化。", "human": "des boulettes de farine", "chatgpt": "", "deepseek": "", "subtype": "节令饮食", "status": "初步纳入", "chapter": "16", "chapters": "16、24", "context": "虎妞很高兴。她张罗着煮元宵，包饺子，白天逛庙，晚上逛灯。她不许祥子有任何主张，可是老不缺着他的嘴，变法儿给他买些做些…", "french": "Elle s’affairait à préparer des raviolis et des boulettes de farine pour la fête.", "position": "第16章·第2段", "hits": "2", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第16章·第2段（EPUB正文段序，非页码）"}, {"id": "CSI-093", "category": "物质文化负载词", "word": "饺子", "reason": "传统包馅面食，原文与元宵节饮食相连；节庆用途可另加社会文化辅助标签。", "human": "des raviolis", "chatgpt": "", "deepseek": "", "subtype": "节令饮食", "status": "初步纳入", "chapter": "16", "chapters": "16", "context": "虎妞很高兴。她张罗着煮元宵，包饺子，白天逛庙，晚上逛灯。她不许祥子有任何主张，可是老不缺着他的嘴，变法儿给他买些做些新鲜的东…", "french": "Elle s’affairait à préparer des raviolis et des boulettes de farine pour la fête.", "position": "第16章·第2段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第16章·第2段（EPUB正文段序，非页码）"}, {"id": "CSI-094", "category": "物质文化负载词", "word": "白薯粥", "reason": "底层家庭以白薯煮制的粥食，关联贫困饮食。", "human": "de bouillons de riz avec des patates", "chatgpt": "", "deepseek": "", "subtype": "地方饮食", "status": "初步纳入", "chapter": "16", "chapters": "16", "context": "…，还得敷衍年轻挣钱的男人。她们怀着孕也得照常操作，只吃着窝窝头与白薯粥；不，不但要照常工作，还得去打粥，兜揽些活计——幸而老少都吃饱了躺下，她们得抱着个小煤油灯…", "french": "Quand elles étaient enceintes, elles ne cessaient pas de travailler et ne se nourrissaient que de bouillons de riz avec des patates.", "position": "第16章·第2段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第16章·第4段（EPUB正文段序，非页码）"}, {"id": "CSI-095", "category": "物质文化负载词", "word": "刮骨肉", "reason": "从骨上刮取的低价肉食，原文用于表现贫困消费。", "human": "des lambeaux de viande récupérés sur les os", "chatgpt": "", "deepseek": "", "subtype": "地方饮食", "status": "初步纳入", "chapter": "16", "chapters": "16", "context": "…她不理那群苦人。来到这里作小买卖的，几乎都是卖那顶贱的东西，什么刮骨肉，冻白菜，生豆汁，驴马肉，都来这里找照顾主。自从虎妞搬来，什么卖羊头肉的，熏鱼的，硬面饽饽…", "french": "Ils vendaient des choux gelés, des haricots au jus, des lambeaux de viande récupérés sur les os, ou de la viande de cheval.", "position": "第16章·第3段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第16章·第5段（EPUB正文段序，非页码）"}, {"id": "CSI-096", "category": "物质文化负载词", "word": "生豆汁", "reason": "北京豆汁类饮食的具体形态，须区分原料与成品饮用方式。", "human": "des haricots au jus", "chatgpt": "", "deepseek": "", "subtype": "地方饮食", "status": "初步纳入", "chapter": "16", "chapters": "16", "context": "…来到这里作小买卖的，几乎都是卖那顶贱的东西，什么刮骨肉，冻白菜，生豆汁，驴马肉，都来这里找照顾主。自从虎妞搬来，什么卖羊头肉的，熏鱼的，硬面饽饽的，卤煮炸豆腐的…", "french": "Ils vendaient des choux gelés, des haricots au jus, des lambeaux de viande récupérés sur les os, ou de la viande de cheval.", "position": "第16章·第3段", "hits": "1", "alignment": "原译以豆类加汁表述，与北京豆汁所指不同。", "source": "Le Pousse-pousse，法文第16章·第5段（EPUB正文段序，非页码）"}, {"id": "CSI-097", "category": "物质文化负载词", "word": "豆汁", "reason": "北京传统发酵饮食名称，不能等同于普通豆浆。", "human": "des haricots au jus", "chatgpt": "", "deepseek": "", "subtype": "地方饮食", "status": "初步纳入", "chapter": "16", "chapters": "16、23、24", "context": "… ，也在门前吆喊两声。她端着碗，扬着脸，往屋里端这些零食，小孩子们都把铁条似的手指伸在口里…", "french": "Depuis l’arrivée de Tigresse, les marchands « de luxe », ceux qui vendaient des têtes de mouton, du poisson fumé, des galettes, des pâtes de soja frites, s’attardaient aussi devant la porte en criant leurs boniments.", "position": "第16章·第3段", "hits": "1", "alignment": "卤煮细节未独立明示。", "source": "Le Pousse-pousse，法文第16章·第5段（EPUB正文段序，非页码）"}, {"id": "CSI-101", "category": "物质文化负载词", "word": "红豆小米粥", "reason": "以红豆和小米熬制的传统粥食。", "human": "un bol de bouillon de riz", "chatgpt": "", "deepseek": "", "subtype": "地方饮食", "status": "初步纳入", "chapter": "16", "chapters": "16", "context": "…了两壶茶，他觉出饿来，决定在外面吃饱再回家。吃了十二两肉饼，一碗红豆小米粥，一边打着响嗝一边慢慢往家走。准知道家里有个雷等着他呢，可是他很镇定；他下了决心：不跟她吵…", "french": "Avec une douzaine de boulettes de viande et un bol de bouillon de riz dans l’estomac, il rota tout le long du chemin du retour.", "position": "第16章·第22段", "hits": "1", "alignment": "红豆、小米等原料信息未保留。", "source": "Le Pousse-pousse，法文第16章·第9段（EPUB正文段序，非页码）"}, {"id": "CSI-102", "category": "物质文化负载词", "word": "新白底双脸鞋", "reason": "具有特定底色与鞋脸式样的布鞋名称。", "human": "ses chaussures de toile à semelle blanche", "chatgpt": "", "deepseek": "", "subtype": "传统服饰", "status": "初步纳入", "chapter": "17", "chapters": "17", "context": "…屑于张罗买卖。他一会儿啪啪的用新蓝布掸子抽抽车，一会儿跺跺自己的新白底双脸鞋，一会儿眼看着鼻尖，立在车旁微笑，等着别人来夸奖他的车，然后就引起话头，说上没完。他能这样…", "french": "On le voyait partout, vêtu d’une veste et d’un pantalon blancs, tapoter son pousse étincelant avec une serviette bleue d’une propreté irréprochable, frapper le sol de ses chaussures de toile à semelle blanche ; ou attendre, souriant et les yeux modestement baissés, les admirateurs.", "position": "第17章·第13段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第17章·第11段（EPUB正文段序，非页码）"}, {"id": "CSI-103", "category": "物质文化负载词", "word": "花洋布大衫", "reason": "以近代印花布制作的旧式长上衣。", "human": "une robe à fleurs", "chatgpt": "", "deepseek": "", "subtype": "传统服饰", "status": "初步纳入", "chapter": "17", "chapters": "17", "context": "小福子就是把铺板卖了，还上房租，只穿着件花洋布大衫，戴着一对银耳环，回到家中来的。", "french": "Si elle était gentille, il lui faisait tailler une robe à fleurs à un yuan ; sinon, il la gardait à la maison.", "position": "第17章·第20段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第17章·第16段（EPUB正文段序，非页码）"}, {"id": "CSI-104", "category": "物质文化负载词", "word": "麦茬白薯", "reason": "涉及种植茬口及品类称谓的白薯，需农业或方言资料核义。", "human": "〔本处未见独立对应〕", "chatgpt": "", "deepseek": "", "subtype": "地方饮食", "status": "初步纳入", "chapter": "17", "chapters": "17", "context": "…会去跟着土车拾些碎铜烂纸，有时候能买上几个烧饼，有时候只能买一斤麦茬白薯，连皮带须子都吞了下去，有时候俩人才有一个大铜子，只好买了落花生或铁蚕豆，虽然不能挡饥，可…", "french": "〔词／句级对应未确立，见“对齐说明”〕", "position": "第17章·第22段", "hits": "1", "alignment": "两兄弟谋生与具体食品的段落在该处法译中未见对应。 未见对应不等于译者省译定论，需结合中文底本版本另考。", "source": "法文第17章；本处未确立对应"}, {"id": "CSI-105", "category": "物质文化负载词", "word": "铁蚕豆", "reason": "以硬脆口感命名的蚕豆零食，不能按金属实物理解。", "human": "〔本处未见独立对应〕", "chatgpt": "", "deepseek": "", "subtype": "地方饮食", "status": "初步纳入", "chapter": "17", "chapters": "17", "context": "…连皮带须子都吞了下去，有时候俩人才有一个大铜子，只好买了落花生或铁蚕豆，虽然不能挡饥，可是能多嚼一会儿。", "french": "〔词／句级对应未确立，见“对齐说明”〕", "position": "第17章·第22段", "hits": "1", "alignment": "两兄弟谋生与具体食品的段落在该处法译中未见对应。 未见对应不等于译者省译定论，需结合中文底本版本另考。", "source": "法文第17章；本处未确立对应"}, {"id": "CSI-106", "category": "物质文化负载词", "word": "杂合面", "reason": "混合粮食制成的面粉，反映贫困家庭的粗粮消费。", "human": "quelques nouilles", "chatgpt": "", "deepseek": "", "subtype": "地方饮食", "status": "初步纳入", "chapter": "18", "chapters": "18", "context": "…多少钉子，才借到一张二十枚的破纸票。攥着这张宝贝票子，她出去弄点杂合面来，勾一锅粥给大家吃。", "french": "Après avoir essuyé bien des refus, elle réussissait à réunir une vingtaine de piécettes, avec lesquelles elle allait chercher quelques nouilles pour toute la famille.", "position": "第18章·第2段", "hits": "1", "alignment": "原译为面条，未保留混合粮食面粉的具体所指。", "source": "Le Pousse-pousse，法文第18章·第2段（EPUB正文段序，非页码）"}, {"id": "CSI-107", "category": "物质文化负载词", "word": "黄绵纸", "reason": "画符所用纸张，物质形制与符箓用途交叉。", "human": "une feuille de papier jaune", "chatgpt": "", "deepseek": "", "subtype": "宗教用品", "status": "初步纳入", "chapter": "19", "chapters": "19", "context": "“童儿”急忙递过黄绵纸，大仙在香苗上抓了几抓，而后沾着吐沫在纸上画。", "french": "Le « garçon vierge » s’empressa de lui présenter une feuille de papier jaune.", "position": "第19章·第31段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第19章·第40段（EPUB正文段序，非页码）"}, {"id": "CSI-108", "category": "物质文化负载词", "word": "芝麻酱烧饼", "reason": "以芝麻酱加工的地方烧饼。", "human": "des galettes aux sésames toutes chaudes", "chatgpt": "", "deepseek": "", "subtype": "地方饮食", "status": "初步纳入", "chapter": "19", "chapters": "19、24", "context": "…以祥子得给她预备点饭。祥子把这个托付给小福子去办。小福子给买来热芝麻酱烧饼和酱肘子；陈二奶奶还嫌没有盅酒吃。", "french": "Petite Fou-tse se chargea de rapporter des galettes aux sésames toutes chaudes et de la viande en sauce.", "position": "第19章·第34段", "hits": "2", "alignment": "未明确译出“芝麻酱”的制法。", "source": "Le Pousse-pousse，法文第19章·第45段（EPUB正文段序，非页码）"}, {"id": "CSI-109", "category": "物质文化负载词", "word": "酱肘子", "reason": "酱制猪肘的传统熟食。", "human": "de la viande en sauce", "chatgpt": "", "deepseek": "", "subtype": "地方饮食", "status": "初步纳入", "chapter": "19", "chapters": "19", "context": "…预备点饭。祥子把这个托付给小福子去办。小福子给买来热芝麻酱烧饼和酱肘子；陈二奶奶还嫌没有盅酒吃。", "french": "Petite Fou-tse se chargea de rapporter des galettes aux sésames toutes chaudes et de la viande en sauce.", "position": "第19章·第34段", "hits": "1", "alignment": "概括为带酱汁的肉，未保留肘子部位。", "source": "Le Pousse-pousse，法文第19章·第45段（EPUB正文段序，非页码）"}, {"id": "CSI-110", "category": "物质文化负载词", "word": "纸钱", "reason": "丧葬及祭祀中供亡者使用的象征性钱币。", "human": "« papier-monnaie »", "chatgpt": "", "deepseek": "", "subtype": "丧葬用品", "status": "初步纳入", "chapter": "20", "chapters": "20", "context": "…人送殡，除了祥子，就是小福子的两个弟弟，一人手中拿着薄薄的一打儿纸钱，沿路撒给那拦路鬼。", "french": "Ils tenaient chacun à la main une liasse de « papier-monnaie » destinée aux morts et les semaient le long du chemin pour les démons qui mettraient éventuellement obstacle au voyage de la défunte.", "position": "第20章·第4段", "hits": "1", "alignment": "句中补充 destinée aux morts，说明用于死者。", "source": "Le Pousse-pousse，法文第20章·第4段（EPUB正文段序，非页码）"}, {"id": "CSI-111", "category": "物质文化负载词", "word": "黄狮子", "reason": "原文香烟品牌或品名，不能按动物指称翻译。", "human": "Lion jaune", "chatgpt": "", "deepseek": "", "subtype": "近代商品", "status": "初步纳入", "chapter": "20", "chapters": "20、21", "context": "…了起来。看了屋中一眼，他不敢再看。心中不知怎样好。他出去买了包“黄狮子”烟来。坐在炕沿上，点着了一支烟；并不爱吸。呆呆的看着烟头上那点蓝烟，忽然泪一串串的流下来…", "french": "Puis il se leva et après un rapide coup d’œil, il ressortit pour acheter un paquet de « Lion jaune ».", "position": "第20章·第6段", "hits": "5", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第20章·第6段（EPUB正文段序，非页码）"}, {"id": "CSI-112", "category": "物质文化负载词", "word": "白缎子绣花的拖鞋", "reason": "以缎面和刺绣工艺构成的女性鞋饰，文化特有性需结合场景复核。", "human": "une paire de pantoufles en satin blanc brodées de fleurs", "chatgpt": "", "deepseek": "", "subtype": "传统服饰", "status": "初步纳入", "chapter": "21", "chapters": "21", "context": "…着话跟他说。她穿着件粉红的卫生衣，下面衬着条青裤子，脚上趿拉着双白缎子绣花的拖鞋。祥子低着头笨手笨脚的工作，不敢看她，可是又想看她，她的香水味儿时时强烈的流入他的鼻中，似…", "french": "Elle portait une blouse rose et un pantalon bleu ciel et traînait aux pieds une paire de pantoufles en satin blanc brodées de fleurs.", "position": "第21章·第3段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第21章·第3段（EPUB正文段序，非页码）"}, {"id": "CSI-113", "category": "物质文化负载词", "word": "煎包儿", "reason": "以煎制方式加工的包子，需区分蒸包。", "human": "pâtes farcies de trognon de chou", "chatgpt": "", "deepseek": "", "subtype": "地方饮食", "status": "初步纳入", "chapter": "22", "chapters": "22", "context": "…——不好往下咽的东西——就作为勤苦耐劳的新生活的开始。他买了十个煎包儿，里边全是白菜帮子，外边又“皮”又牙碜。不管怎样难吃，也都把它们吞下去。吃完，用手背抹了抹…", "french": "Pour se le prouver, il acheta une dizaine de pâtes farcies de trognon de chou et se força à les mastiquer et à les avaler tant elles étaient caoutchouteuses.", "position": "第22章·第4段", "hits": "1", "alignment": "依上下文说明白菜帮子馅，未保留煎制方式。", "source": "Le Pousse-pousse，法文第22章·第4段（EPUB正文段序，非页码）"}, {"id": "CSI-114", "category": "物质文化负载词", "word": "元宝筐子", "reason": " B正文段序，非页码）"}, {"id": "CSI-155", "category": "社会文化负载词", "word": "车饭钱", "reason": "雇主赴宴时给予车夫的饭食补贴，联系包车劳动待遇。", "human": "pourboires", "chatgpt": "", "deepseek": "", "subtype": "雇佣惯例", "status": "初步纳入", "chapter": "1", "chapters": "1", "context": "…际多，饭局多的主儿，平均一月有上十来个饭局，他就可以白落两三块的车饭钱。加上他每月再省出个块儿八角的，也许是三头五块的，一年就能剩起五六十块！这样，他的希望就近…", "french": "Avec un patron qui recevait beaucoup, il aurait une dizaine de soirées par mois et ça lui permettrait de réunir à peu près deux ou trois yuans de pourboires.", "position": "第1章·第16段", "hits": "1", "alignment": "原译归为小费，未保留专门饭食补贴含义。", "source": "Le Pousse-pousse，法文第1章·第21段（EPUB正文段序，非页码）"}, {"id": "CSI-156", "category": "社会文化负载词", "word": "双寿", "reason": "祥子将购车日兼作生日形成的双重庆贺称谓。", "human": "double anniversaire", "chatgpt": "", "deepseek": "", "subtype": "祝寿习俗", "status": "初步纳入", "chapter": "1", "chapters": "1", "context": "怎样过这个“双寿”呢？祥子有主意：头一个买卖必须拉个穿得体面的人，绝对不能是个女的。最好是拉到前门，其次是…", "french": "Comment le fêter, ce double anniversaire ?", "position": "第1章·第21段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第1章·第36段（EPUB正文段序，非页码）"}, {"id": "CSI-157", "category": "生态文化负载词", "word": "礼王坟", "reason": "带王府身份信息的墓地名称；仅作路线地名时可排除。", "human": "Li-wang-fen", "chatgpt": "", "deepseek": "", "subtype": "历史空间", "status": "初步纳入", "chapter": "2", "chapters": "2", "context": "…里是磨石口——老天爷，这必须是磨石口！——他往东北拐，过金顶山，礼王坟，就是八大处；从四平台往东奔杏子口，就到了南辛庄。为是有些遮隐，他顶好还顺着山走，从北辛庄…", "french": "Il voyait clairement son itinéraire : de là, il allait tourner vers le nord-est, traverser Tsin-ting-chan, Li-wang-fen, et il se retrouverait à Pa-ta-tch’ou.", "position": "第2章·第23段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第2章·第39段（EPUB正文段序，非页码）"}, {"id": "CSI-158", "category": "生态文化负载词", "word": "静宜园", "reason": "历史园林专名，兼具路线指称与皇家园林文化；纳入边界需复核。", "human": "au jardin Tsing-yi", "chatgpt": "", "deepseek": "", "subtype": "历史空间", "status": "初步纳入", "chapter": "2", "chapters": "2", "context": "…辛庄，往北，过魏家村；往北，过南河滩；再往北， , "human": "la Seconde Dame", "chatgpt": "", "deepseek": "", "subtype": "家庭制度", "status": "初步纳入", "chapter": "5", "chapters": "5", "context": "…儿一样的不顺心！这回是在杨宅。杨先生是上海人，杨太太是天津人，杨二太太是苏州人。一位先生，两位太太，南腔北调的生了不知有多少孩子。头一天上工，祥子就差点发了昏。…", "french": "Du yamen, Siang-tse se hâta de revenir pour emmener la Seconde Dame au marché Tong-an ou chez des amies.", "position": "第5章·第13段", "hits": "12", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第5章·第24段（EPUB正文段序，非页码）"}, {"id": "CSI-177", "category": "社会文化负载词", "word": "少爷", "reason": "旧式雇佣家庭对男性子弟的尊称，体现主仆身份差异。", "human": "gamins mal élevés", "chatgpt": "", "deepseek": "", "subtype": "家庭称谓", "status": "初步纳入", "chapter": "5", "chapters": "5、8、12、21", "context": "…工，祥子就差点发了昏。一清早，大太太坐车上市去买菜。回来，分头送少爷小姐们上学，有上初中的，有上小学的，有上幼稚园的；学校不同，年纪不同，长相不同，可是都一样…", "french": "Malgré les différences d’âge, ils présentaient tous un trait commun : ils étaient des gamins mal élevés.", "position": "第5章·第13段", "hits": "9", "alignment": "首次“少爷们”转为带评价的孩子称呼。", "source": "Le Pousse-pousse，法文第5章·第24段（EPUB正文段序，非页码）"}, {"id": "CSI-178", "category": "社会文化负载词", "word": "衙门", "reason": "旧式官署称谓，小说中亦用于近代办公场所。", "human": "yamen", "chatgpt": "", "deepseek": "", "subtype": "历史制度", "status": "初步纳入", "chapter": "5", "chapters": "5、7、20", "context": "…是坐在车上，至老实的也比猴子多着两手儿。把孩子们都送走，杨先生上衙门。送到衙门，赶紧回来，拉二太太上东安市场或去看亲友。回来，接学生回家吃午饭。吃完，再送走。…", "french": "Yang, qui se rendait au yamen.", "position": "第5章·第13段", "hits": "4", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第5章·第24段（EPUB正文段序，非页码）"}, {"id": "CSI-179", "category": "社会文化负载词", "word": "铜板", "reason": "旧时铜币称谓，原文与底层小额消费有关。", "human": "〔本处未见独立对应〕", "chatgpt": "", "deepseek": "", "subtype": "旧制货币", "status": "初步纳入", "chapter": "5", "chapters": "5、18、24", "context": "…户，恰好在一支街灯底下，给屋里一点亮。屋里又潮又臭，地上的土有个铜板厚，靠墙放着份铺板，没有别的东西。他摸了摸床板，知道他要是把头放下，就得把脚蹬在墙上；把脚…", "french": "〔词／句级对应未确立，见“对齐说明”〕", "position": "第5章·第17段", "hits": "7", "alignment": "此处用铜板形容地面灰土厚度的细节未见独立对应。 未见对应不等于译者省译定论，需结合中文底本版本另考。", "source": "法文第5章；本处未确立对应"}, {"id": "CSI-180", "category": "社会文化负载词", "word": "头儿钱", "reason": "原文与牌局及仆人所得相关的特殊款项，具体分配机制需核实。", "human": "la somme que les participants avaient remise avant le jeu, et qui, selon la coutume, revenait aux domestiques", "chatgpt": "", "deepseek": "", "subtype": "交际惯例", "status": "初步纳入", "chapter": "5", "chapters": "5", "context": "…然全归祥子统辖。他讨厌这群猴子，可是偷偷往屋中了一眼，大太太管着头儿钱，像是很认真的样子。他心里说：别看这个大娘们厉害，也许并不胡涂，知道乘这种时候给仆人们多弄…", "french": "Bien qu’il les détestât, il s’efforça de traiter ces petits singes en « jeunes seigneurs » ; il avait aperçu, par la porte du salon, la Première Dame compter avec sérieux la somme que les participants avaient remise avant le jeu, et qui, selon la coutume, revenait aux domestiques.", "position": "第5章·第19段", "hits": "2", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第5章·第34段（EPUB正文段序，非页码）"}, {"id": "CSI-181", "category": "社会文化负载词", "word": "毛票", "reason": "以角为面额的小额纸币俗称。", "human": "le billet", "chatgpt": "", "deepseek": "", "subtype": "旧制货币", "status": "初步纳入", "chapter": "5", "chapters": "5、20", "context": "祥子的脸忽然紫了，挺了挺腰，好像头要顶住房梁，一把抓起那张毛票，摔在太太的胖脸上：“给我四天的工钱！”", "french": "Saisissant le billet, il le lança à la figure bouffie de sa patronne.", "position": "第5章·第24段", "hits": "3", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第5章·第40段（EPUB正文段序，非页码）"}, {"id": "CSI-182", "category": "社会文化负载词", "word": "作寿", "reason": "筹办生日庆贺礼仪，关联席面、赠礼及人情往来。", "human": "fêter son anniversaire", "chatgpt": "", "deepseek": "", "subtype": "祝寿习俗", "status": "初步纳入", "chapter": "6", "chapters": "6、13", "context": "“没人，”她把笑声收了，脸上可还留着笑容。“老头子给姑妈作寿去了，得有两三天的耽误呢；姑妈在南苑住。”一边说，一边又给他倒满了盅。", "french": "— Le vieux est allé chez ma tante, pour fêter son anniversaire.", "position": "第6章·第18段", "hits": "2", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第6章·第32段（EPUB正文段序，非页码）"}, {"id": "CSI-183", "category": "社会文化负载词", "word": "白房子", "reason": "小说语境指低等妓院，不能按白色房屋直译。", "human": "〔本处未见独立对应〕", "c rce": "Le Pousse-pousse，法文第6章·第22段（EPUB正文段序，非页码）"}, {"id": "CSI-279", "category": "宗教文化负载词", "word": "祭灶", "reason": "年末祭祀灶神的传统仪式。", "human": "sacrifices aux dieux du Foyer", "chatgpt": "", "deepseek": "", "subtype": "民间信仰", "status": "初步纳入", "chapter": "11", "chapters": "11", "context": "街上越来越热闹了，祭灶的糖瓜摆满了街，走到哪里也可以听到“糖来，糖”的声音。祥子本来盼着过年，现在可是一点也不起…", "french": "Le 23, jour des sacrifices aux dieux du Foyer, dans l’après-midi, le vent d’est apporta de gros nuages sombres.", "position": "第11章·第4段", "hits": "3", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第11章·第3段（EPUB正文段序，非页码）"}, {"id": "CSI-280", "category": "宗教文化负载词", "word": "糖瓜", "reason": "祭灶语境中的传统糖制供品，食品形制可辅标物质文化。", "human": "tang-kua – sucres d’orge en forme de petits melons", "chatgpt": "", "deepseek": "", "subtype": "祭祀食品", "status": "初步纳入", "chapter": "11", "chapters": "11", "context": "街上越来越热闹了，祭灶的糖瓜摆满了街，走到哪里也可以听到“糖来，糖”的声音。祥子本来盼着过年，现在可是一点也不起劲，街…", "french": "Les marchands de tang-kua – sucres d’orge en forme de petits melons – étaient aux cent coups.", "position": "第11章·第4段", "hits": "2", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第11章·第3段（EPUB正文段序，非页码）"}, {"id": "CSI-281", "category": "宗教文化负载词", "word": "祭神", "reason": "以供奉和礼仪敬奉神灵的活动。", "human": "le sacrifice", "chatgpt": "", "deepseek": "", "subtype": "民间信仰", "status": "初步纳入", "chapter": "11", "chapters": "11", "context": "…森的气象。街上的人都显出点惊急的样子，步行的，坐车的，都急于回家祭神，可是地上湿滑，又不敢放开步走。卖糖的小贩急于把应节的货物轰出去，上气不接下气的喊叫，听着…", "french": "Les gens dans la rue manifestèrent soudain de l’inquiétude : piétons, cyclistes, automobilistes, tous avaient hâte de regagner leur maison pour le sacrifice.", "position": "第11章·第5段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第11章·第3段（EPUB正文段序，非页码）"}, {"id": "CSI-282", "category": "宗教文化负载词", "word": "八仙人", "reason": "道教及民间传说中的八仙形象，原文用于寿桃装饰。", "human": "les figures des huit Immortels", "chatgpt": "", "deepseek": "", "subtype": "神话人物", "status": "初步纳入", "chapter": "13", "chapters": "13", "context": "…堂苹果，虎妞背地里掖给他两块钱，教他去叫寿桃寿面，寿桃上要一份儿八仙人，作为是祥子送的。苹果买到，马上摆好；待了不大会儿，寿桃寿面也来到，放在苹果后面，大寿桃点…", "french": "Tigresse lui glissa deux yuans par-derrière, en lui recommandant d’acheter des pêches et des gâteaux de longévité sans oublier d’ajouter sur les pêches les figures des huit Immortels.", "position": "第13章·第45段", "hits": "2", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第13章·第61段（EPUB正文段序，非页码）"}, {"id": "CSI-283", "category": "宗教文化负载词", "word": "庙会", "reason": "由寺庙信仰活动发展而来的集市娱乐，兼具宗教与社会属性。", "human": "des fêtes populaires", "chatgpt": "", "deepseek": "", "subtype": "民俗信仰", "status": "初步纳入", "chapter": "15", "chapters": "15、24", "context": "…有个知心的男子。现在，她要捞回来这点缺欠，要大摇大摆的在街上，在庙会上，同着祥子去玩。", "french": "Elle rêvait de déambuler dans la rue ou d’assister à des fêtes populaires, suspendue au bras de Siang-tse.", "position": "第15章·第34段", "hits": "2", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第15章·第43段（EPUB正文段序，非页码）"}, {"id": "CSI-284", "category": "宗教文化负载词", "word": "逛庙", "reason": "节庆中出游寺庙或庙市的活动，需辨别礼佛与游乐侧重。", "human": "elle se rendit aux temples pour assister à des festivités", "chatgpt": "", "deepseek": "", "subtype": "民俗信仰", "status": "初步纳入", "chapter": "16", "chapters": "16、24", "context": "虎妞很高兴。她张罗着煮元宵，包饺子，白天逛庙，晚上逛灯。她不许祥子有任何主张，可是老不缺着他的嘴，变法儿给他买些做些新鲜的东西吃。大杂…", "french": "Dans la journée, elle se rendit aux temples pour assister à des festivités et occupa sa soirée à se promener dans les rues ornées de lanternes.", "position": "第16章·第2段", "hits": "3", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第16章·第2段（EPUB正文段序，非页码）"}, {"id": "CSI-285", "category": "宗教文化负载词", "word": "娘娘庙", "reason": "供奉女神并与求子求药相关的民间信仰场所。", "human": "temple bouddhiste pour implorer la déesse Kuan-yin", "chatgpt": "", "deepseek": "", "subtype": "宗教场所", "status": "初步纳入", "chapter": "19", "chapters": "19", "context": "祥子昏昏沉沉的睡了两昼夜，虎妞着了慌。到娘娘庙，她求了个神方：一点香灰之外，还有两三味草药。给他灌下去，他的确睁开眼看了看，可是待了 次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第1章·第5段（EPUB正文段序，非页码）"}, {"id": "CSI-311", "category": "语言文化负载词", "word": "四六步儿", "reason": "描述拉车步态的特殊说法，具体步法需行业资料核实。", "human": "le pas bien cadencé", "chatgpt": "", "deepseek": "", "subtype": "行业表达", "status": "初步纳入", "chapter": "1", "chapters": "1", "context": "…们都晓得。他们自己有一套外国话，不传授给别人。他们的跑法也特别，四六步儿不快不慢，低着头，目不旁视的，贴着马路边儿走，带出与世无争，而自有专长的神气。因为拉着洋人…", "french": "La tête légèrement baissée, le regard fixé droit devant eux, le pas bien cadencé, ils courent en se serrant le plus près possible contre le bord de la chaussée, avec un air de spécialiste qui ne daigne pas se mêler aux ignorants.", "position": "第1章·第6段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第1章·第6段（EPUB正文段序，非页码）"}, {"id": "CSI-312", "category": "语言文化负载词", "word": "有货可卖才能遇到识货的人", "reason": "借商品买卖说明能力与认可，含商业评价方式。", "human": "Encore faut-il que le bonhomme et son pousse soient de qualité !", "chatgpt": "", "deepseek": "", "subtype": "惯用表达", "status": "排除", "chapter": "1", "chapters": "1", "context": "…然，他也晓得这样的机遇不完全出于偶然，而必须人与车都得漂亮精神，有货可卖才能遇到识货的人。想了一想，他相信自己有那个资格：他有力气，年纪正轻；所差的是他还没有跑过，与不敢一上手就…", "french": "Encore faut-il que le bonhomme et son pousse soient de qualité !", "position": "第1章·第9段", "hits": "1", "alignment": "整合、改写为人与车的质量。", "source": "Le Pousse-pousse，法文第1章·第11段（EPUB正文段序，非页码）"}, {"id": "CSI-313", "category": "语言文化负载词", "word": "杀好了腰", "reason": "本版注释为把腰部勒细，需按穿衣动作而非杀戮理解。", "human": "La taille bien serrée", "chatgpt": "", "deepseek": "", "subtype": "方言表达", "status": "初步纳入", "chapter": "1", "chapters": "1", "context": "…的铁扇面似的胸，与直硬的背；扭头看看自己的肩，多么宽，多么威严！杀好了腰，再穿上肥腿的白裤，裤脚用鸡肠子带儿系往，露出那对“出号”的大脚！是的，他无疑的可以成为最…", "french": "La taille bien serrée, il mit un pantalon large en tissu blanc, attaché en bas par une mince corde de boyaux de coq tressés.", "position": "第1章·第10段", "hits": "1", "alignment": "按本行首次中文语境摘录；词项随上下文可能调整词形。", "source": "Le Pousse-pousse，法文第1章·第12段（EPUB正文段序，非页码）"}, {"id": "CSI-314", "category": "语言文化负 function offlineClone(x){return JSON.parse(JSON.stringify(x))}
function offlinePersist(next){localStorage.setItem(STORAGE_KEY,JSON.stringify(next));offlineData=next}
window.fetch=async function(url,options={}){
 try {
  if(url==='/api/data')return new Response(JSON.stringify(offlineData),{status:200});
  let request=JSON.parse(options.body),next=offlineClone(offlineData);
  function put(kind,item){let n=offlineClone(item),idx=next[kind].findIndex(x=>x.id===n.id);if(idx>=0){next.history.unshift({at:new Date().toISOString(),kind,id:n.id,body:next[kind][idx]});next[kind][idx]=n}else next[kind].push(n);n.updatedAt=new Date().toISOString();return n}
  if(url==='/api/save'){let n=put(request.kind,request.item);offlinePersist(next);return new Response(JSON.stringify(n),{status:200})}
  if(url==='/api/restore'){
   for(let k of ['terms','batches','runs','tasks'])if(!Array.isArray(request[k]))throw Error('备份格式错误');
   for(let k of ['terms','batches','runs','tasks'])for(let item of request[k]){if(!item.id)throw Error('缺少编号');put(k,item)}
   let known=new Set(next.history.map(h=>JSON.stringify(h)));for(let h of request.history||[])if(!known.has(JSON.stringify(h)))next.history.push(h);
   offlinePersist(next);return new Response('{"status":"restored"}',{status:200})
  }
  return new Response('{}',{status:404});
 } catch(e){alert('未能保存：'+e.message+'。请立即导出备份。');return new Response(JSON.stringify({error:e.message}),{status:400})}
};

function tasks(){let pending=data.tasks.filter(t=>!t.done).sort((a,b)=>a.date.localeCompare(b.date)),done=data.tasks.filter(t=>t.done).sort((a,b)=>b.completedAt.localeCompare(a.completedAt));$('#content').innerHTML=heading('每日计划','今天做一点，明天就轻松一点。已完成事项会一直保存。',`<button class="primary" onclick="edit('tasks')">＋ 新建待办</button>`)+`<div class="card"><div class="card-title"><h3>待完成 <span class="tag">${pending.length}</span></h3><span>${today()}</span></div>${pending.map(taskRow).join('')||'<div class="empty">今天还没有安排，添加一个小目标吧 ☀</div>'}</div><div class="card"><div class="card-title"><h3>已完成 · 研究足迹 <span class="tag">${done.length}</span></h3><span>保留计划日期与完成时间</span></div>${done.map(taskRow).join('')||'<div class="empty">完成的每一件小事，都会留在这里。</div>'}</div>`}
async function toggle(id){let t=data.tasks.find(t=>t.id===id);await save('tasks',{...t,done:!t.done,completedAt:t.done?'':new Date().toISOString()});await load();toast(t.done?'已恢复为待办':'又前进了一小步，完成记录已保存！')}
function history(){$('#content').innerHTML=heading('修改历史','每次保存旧记录前，自动保留上一版本。备份包含全部历史。')+`<div class="card">${data.history.map(h=>`<details class="history"><summary>${esc(h.id)} · ${esc(new Date(h.at).toLocaleString('zh-CN'))} · 修改前版本</summary><pre>${esc(JSON.stringify(h.body,null,2))}</pre></details>`).join('')||'<div class="empty">暂无修改历史，新建后的首次编辑会保留旧版本。</div>'}</div>`}
function download(name,text,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function backup(){download('小新研究室-'+today()+'.json',JSON.stringify(data,null,2),'application/json');toast('备份已导出，请妥善保存')}
function csvExport(){let cols=schemas[page].map(c=>c[0]),quote=v=>'"'+String(Array.isArray(v)?v.join('、'):v??'').replace(/"/g,'""')+'"';download(page+'-'+today()+'.csv','\ufeff'+[schemas[page].map(c=>quote(c[1])).join(','),...filtered().map(t=>cols.map(k=>quote(/^[=+@-]/.test(String(t[k]??''))?"'"+t[k]:t[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8')}
async function restore(input){try{let obj=JSON.parse(await input.files[0].text());for(let k of ['terms','batches','runs','tasks'])if(!Array.isArray(obj[k]))throw Error('备份格式不正确');if(!confirm('按编号合并导入备份；同编号记录将更新，旧版本会留存。继续？'))return;let r=await fetch('/api/restore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});if(!r.ok)throw Error('导入失败，原数据未改动');await load();toast('备份数据已合并导入')}catch(e){toast(e.message)}input.value=''}
load().catch(()=>$('#content').innerHTML='<div class="empty">无法读取离线数据，请使用 Chrome 普通窗口打开</div>');
</script></body></html>
