const AIXELA=[
 ['repetition','保留类','重复','Repetition','保留原项的原有形式。'],
 ['orthographic','保留类','正字法调整','Orthographic adaptation','为目标语书写体系作转写、音译或形式调整，保留其外来指称。'],
 ['linguistic','保留类','语言性（非文化性）翻译','Linguistic (non-cultural) translation','采用目标语中语言层面的对应表达，仍使读者识别源文化指称；不等同于所有“直译”。'],
 ['extraGloss','保留类','文外注释','Extratextual gloss','在正文外通过脚注、尾注等解释文化项。'],
 ['intraGloss','保留类','文内注释','Intratextual gloss','把解释性信息融入正文中。'],
 ['synonymy','替代类','同义替换','Synonymy','以同义或平行指称等方式替换表达，常用于避免重复。'],
 ['limitedUniversal','替代类','有限普遍化','Limited universalization','改用目标读者更易理解、但仍属于源文化的较常见指称。'],
 ['absoluteUniversal','替代类','绝对普遍化','Absolute universalization','改用文化指向较中性的一般表达，去除原项特定的文化指称。'],
 ['naturalization','替代类','归化','Naturalization','用目标文化系统中的特有对应项替换源文化项；不把一切流畅表达都称为归化。'],
 ['deletion','替代类','删除','Deletion','省去该文化项；需核查上下文，避免把未识别的对应译法误判为删除。'],
 ['creation','替代类','自主创造','Autonomous creation','译入原文中未出现的文化项；需要同时记录新增位置与判断依据，不等同于任何增译。']
];
function strategyEditor(t,k){let codes=Array.isArray(t[k+'StrategyCodes'])?t[k+'StrategyCodes']:[],legacy=t[k+'MethodLegacy']??(!codes.length?t[k+'Method']||'':'');return `<div class="strategy-editor"><h4>Aixélá 翻译策略</h4><small>可复选组合策略；如需统计总体取向，请指定主策略。</small>${['保留类','替代类'].map(group=>`<fieldset><legend>${group}</legend>${AIXELA.filter(s=>s[1]===group).map(([id,,label,en,desc])=>`<label class="strategy-option" title="${esc(en+'：'+desc)}"><input type="checkbox" name="${k}StrategyCodes" value="${id}" ${codes.includes(id)?'checked':''}>${label}</label>`).join('')}</fieldset>`).join('')}<label class="field">主策略（供互斥计数）<select name="${k}Primary"><option value="">未指定</option>${AIXELA.map(([id,g,l])=>`<option value="${id}" ${t[k+'Primary']===id?'selected':''}>${g} · ${l}</option>`).join('')}</select></label>${makeField(k+'AnnotationStatus','标注状态',t[k+'AnnotationStatus']||'待标注','select',['待标注','已标注','存疑','不适用'])}${makeField(k+'StrategyReason','标注依据：具体表达与源译文对应证据',t[k+'StrategyReason']||'','textarea')}${makeField(k+'Effect','效果分析：语境意义／文化信息／文学功能／法语表达',t[k+'Effect']||'','textarea')}${makeField(k+'Factors','差异解释：文本内外因素及 AI 生成条件',t[k+'Factors']||'','textarea')}${legacy?`<label class="field">旧版“翻译方法”记录（原样保留，尚不自动归类）<textarea name="${k}MethodLegacy" readonly>${esc(legacy)}</textarea></label>`:''}</div>`}

function zipStore(entries){
 const encoder=new TextEncoder(),locals=[],centrals=[];let offset=0;
 const crcTable=Array.from({length:256},(_,i)=>{let c=i;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;return c>>>0});
 const crc32=b=>{let c=0xffffffff;for(let x of b)c=crcTable[(c^x)&255]^(c>>>8);return (c^0xffffffff)>>>0};
 const join=arr=>{let out=new Uint8Array(arr.reduce((n,b)=>n+b.length,0)),o=0;for(let b of arr){out.set(b,o);o+=b.length}return out};
 for(let [path,text] of entries){let name=encoder.encode(path),body=encoder.encode(text),crc=crc32(body),local=new Uint8Array(30+name.length),l=new DataView(local.buffer);l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x0800,true);l.setUint16(12,33,true);l.setUint32(14,crc,true);l.setUint32(18,body.length,true);l.setUint32(22,body.length,true);l.setUint16(26,name.length,true);local.set(name,30);locals.push(local,body);
 let central=new Uint8Array(46+name.length),c=new DataView(central.buffer);c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,33,true);c.setUint32(16,crc,true);c.setUint32(20,body.length,true);c.setUint32(24,body.length,true);c.setUint16(28,name.length,true);c.setUint32(42,offset,true);central.set(name,46);centrals.push(central);offset+=local.length+body.length;
 }
 let end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(8,entries.length,true);e.setUint16(10,entries.length,true);e.setUint32(12,centrals.reduce((n,b)=>n+b.length,0),true);e.setUint32(16,offset,true);return join([...locals,...centrals,end])
}
function exportWorkbook(){
 const xml=v=>String(v??'').replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
 const categories=[...new Set(state.terms.map(t=>t.category))],sheets=categories.map(c=>({name:c,rows:[termFields.map(c=>c[1]),...state.terms.filter(t=>t.category===c).map(t=>termFields.map(([k])=>t[k]))]}));
 sheets.push({name:'章节关联',rows:[['内部编号','分类','原序号','中文原文','关联章节'],...state.terms.map(t=>[t.id,t.category,t.number,t.word,t.chapter])]});

</script><script>const LESSONS=[
{title:'先建立整体认识',summary:'把预训练、提示词、上下文和输出串成一个过程。',body:`<h2>模型怎样把一章中文变成法语？</h2><p>大语言模型通常把输入文字编码成 token，依据已有参数和当前上下文计算下一个 token 的概率，逐步生成输出。你的翻译要求、人工译文示例和前面的对话，都会成为本次生成的条件；输出并不是简单地逐词查字典。</p><div class="hint green">已有参数 ＋ 当前指令 ＋ 示例与正文 → 条件概率分布 → 逐步解码 → 法语输出。</div><h3>研究时先分清三个层次</h3><ul><li><b>已有能力：</b>来源于模型训练，普通网页用户无法完整观察训练数据或参数。</li><li><b>当次条件：</b>模型实际收到的提示词、示例、正文、会话历史和工具结果。</li><li><b>可见结果：</b>完整原始输出；如果有可见解释，应保留，但解释不等于内部计算过程的完整记录。</li></ul><p>本平台不连接模型。你在对应模型界面完成实验后，把实际指令和输出记录回来。</p>`,sources:[['Transformer 原始论文（2017）','https://arxiv.org/abs/1706.03762']]},
{title:'模型的学习方式',summary:'预训练、微调、偏好对齐与示例引导的差别。',body:`<h2>“学习”可能指四件不同的事</h2><ul><li><b>预训练：</b>通常通过大规模数据上的预测目标优化模型参数，形成语言和任务能力。</li><li><b>监督微调：</b>用任务示例继续优化参数。它需要训练流程，不能仅凭聊天中一句“请学习”就认定已发生。</li><li><b>偏好对齐：</b>通过人类或其他反馈调整模型的行为倾向；具体方法和实现依模型而异。</li><li><b>上下文学习：</b>在输入中提供示例，使模型在后续任务中参照其模式；通常不在这次对话中更新基础模型权重。</li></ul><div class="hint">你准备的“先看人工翻译方法，再翻译”，若通过普通聊天界面进行，通常应记录为“示例引导／上下文学习条件”。除非确实调用了训练流程，不应在论文里直接称为“对模型进行了微调”。</div><h3>还需要区分记忆</h3><p>产品可能另有跨会话记忆或项目资料检索功能。这些功能可以改变送入模型的上下文，但不是基础模型已经被你训练。是否启用、是否参与本次输入应按实际情况记录。</p>`,sources:[['上下文学习：Language Models are Few-Shot Learners（2020）','https://arxiv.org/abs/2005.14165'],['偏好对齐：Training language models to follow instructions with human feedback（2022）','https://arxiv.org/abs/2203.02155']]},
{title:'运行与生成方式',summary:'token、注意力、解码与上下文限制。',body:`<h2>一次生成里面发生什么？</h2><ol><li>输入按词表编码成 token。token 不一定是一个完整汉字或单词。</li><li>许多现代语言模型使用 Transformer 结构，通过注意力等机制处理上下文中的关系。具体模型结构应以对应版本的技术资料为准。</li><li>模型给出下一 token 的条件概率，解码算法选取 token，再继续生成，直到结束条件或输出限制。</li></ol><h3>为什么同一指令可能给出不同译文？</h3><p>随机采样参数、模型版本、会话输入差异和运行实现都可能影响结果。网页端通常不暴露所有设置；未知项应写“不可获取”，不要假定 temperature 为某个值。即便设置了低随机性，也不要承诺跨版本完全相同。</p><h3>长章节怎样处理？</h3><p>上下文长度和输出长度都有上限；还要给指令、示例、历史对话留空间。观察漏译、截断和结束位置。必须分段时，保存各次实际输入、分段位置、前后文与轮次；不要将拼接结果描述成一次完整生成。</p>`,sources:[['Attention Is All You Need（2017）','https://arxiv.org/abs/1706.03762']]},
{title:'思考模式与联网',summary:'界面模式并非可直接观察的全部内部原理。',body:`<h2>思考模式能说明什么？</h2><p>界面显示的“思考”“深度思考”等模式，是产品提供的运行选项。不同产品、版本的含义可能不同，应记录实际模型名称、模式、时间和渠道。不能仅凭按钮名称断言模型采用了某种内部算法，或声称知道它完整的内部思维过程。</p><h3>解释不等于事实证明</h3><p>模型可能对自己的译法给出流畅解释，但解释可以出错，也不构成你标注“意译”“音译”“文化补偿”的直接证据。策略应由研究者结合源文、译文与标注准则判断。</p><h3>联网和检索</h3><p>如果开启搜索、知识库或项目文件，模型可能收到额外检索材料。它们是额外输入条件，不代表已重新训练模型。对比实验应记录是否启用，以及能看到的实际来源；尽量保持两个主体条件可比。</p><div class="hint">原表“Deepseek V3.2 深度思考模式”“GPT-6 思考模式”在本平台仅作为你提供的研究列标签，不代表平台已核实当前产品可选模型、模式或架构。</div>`,sources:[['Chain-of-Thought Prompting Elicits Reasoning in Large Language Models（2022；提示方法研究，不等同于产品内部原理）','https://arxiv.org/abs/2201.11903']]},
{title:'你的学习—翻译流程',summary:'怎样安排示例材料，避免把实验条件混在一起。',body:`<h2>建议把一章分成三个阶段记录</h2><ol><li><b>人工译法学习：</b>保存学习指令、原文与人工译文示例、示例来源以及模型学习后的原始反馈。</li><li><b>学习反馈／方法总结：</b>如果你要求它总结方法，另记该次指令与完整输出。不要把它的自我描述直接变成你的策略结论。</li><li><b>正式翻译：</b>明确只输入待译原文，保存实际翻译指令、完整中文、输出及轮次，并说明是否沿用学习对话。</li></ol><div class="hint">若把同一测试章节的完整人工译文先给模型，再让它翻译该章，结果反映的是“已见目标译文”的条件，不能当作未见参照译文的独立翻译表现。可以研究这种条件，但应如实标明。</div><h3>如果要研究方法迁移</h3><p>可用与测试章节分开的示例作为学习材料，并给两个模型相同示例、相同指令和相同语境。比较“无示例”与“有示例”时，分组记录，避免把两种条件合并统计。</p><h3>每章最少记录什么？</h3><p>实际模型与模式、学习材料、完整指令、完整输入、第一次完整输出、是否沿用会话，以及每一次追问／重试。右侧指令记录就是这些信息的存放位置。</p>`,sources:[['示例引导基础：Language Models are Few-Shot Learners（2020）','https://arxiv.org/abs/2005.14165']]},
{title:'三译本分析与核查',summary:'从词条对照到研究者的策略标注。',body:`<h2>把可观察结果和研究判断分开</h2><p>词条页保留你的表格框架：目标词法译、中文释义、翻译方法、完整译文原句。建议先核对词语实际落在译文何处，再判断策略；多对一、省译、拆分和跨句处理都应按实际语境记录。</p><h3>一套可复核的标注流程</h3><ol><li>确认原文位置、完整中文语境和对应法语句子。</li><li>摘录真实译法；没有明确对应时如实记“未找到对应”并说明，不自行替模型补译。</li><li>依据 Aixélá 的保留／替代两类及具体策略填写标注；可记录组合策略并指定用于互斥统计的主策略，保留边界案例说明。</li><li>如条件允许，用第二位标注者独立复核部分语料，报告分歧与一致性处理。</li></ol><h3>机器翻译评价的边界</h3><p>BLEU 等自动指标衡量与参考译文的表面匹配程度，不能单独证明文化信息保留或翻译优劣。文化负载词研究仍需要语境分析和透明的标注准则。</p>`,sources:[['BLEU: a Method for Automatic Evaluation of Machine Translation（2002）','https://aclanthology.org/P02-1040/']]}
];
function renderLearning(){let l=LESSONS[lessonIndex],note=state.notes[lessonIndex]||{text:'',done:false},done=Object.values(state.notes).filter(n=>n.done).length;$('#app').innerHTML=heading('机器翻译原理 · 学习手册','从基本原理到你的实验流程，学习内容与个人笔记放在一起。')+`<div class="lesson-layout"><div class="card lesson-nav"><div class="card-top"><h3>学习路线 ${done}/${LESSONS.length}</h3></div><div class="card-body">${LESSONS.map((l,i)=>`<button class="${i===lessonIndex?'primary':''}" onclick="lessonIndex=${i};renderLearning()">${state.notes[i]?.done?'✓':String(i+1).padStart(2,'0')}　${l.title}</button>`).join('')}</div></div><div><article class="card lesson"><div class="card-body"><span class="chip">第 ${lessonIndex+1} 节 · ${esc(l.summary)}</span>${l.body}<h3>进一步阅读</h3><ul>${l.sources.map(([name,url])=>`<li><a href="${url}" target="_blank" rel="noopener noreferrer">${esc(name)} ↗</a></li>`).join('')}</ul><small>以上为通用原理与研究方法概述；具体产品的模型架构、训练和运行细节，应以实际版本公开资料为准。</small></div></article><div class="card"><div class="card-top"><h3>我的学习笔记</h3><label><input type="checkbox" ${note.done?'checked':''} onchange="updateNote('done',this.checked)"> 已学习</label></div><div class="card-body"><textarea aria-label="我的学习笔记" placeholder="用自己的话记录原理、疑问，以及对当前章节实验的启发…" oninput="updateNote('text',this.value)">${esc(note.text)}</textarea><small>笔记自动保存，并包含在全部 JSON 备份中。</small></div></div></div></div>`}
function updateNote(k,v){state.notes[lessonIndex]??={text:'',done:false};state.notes[lessonIndex][k]=v;schedule()}
start();
</script></body></html>
