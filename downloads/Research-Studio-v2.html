const AIXELA=[
 ['repetition','保留类','重复','Repetition','保留原项的原有形式。'],
 ['orthographic','保留类','正字法调整','Orthographic adaptation','为目标语书写体系作转写、音译或形式调整，保留其外来指称。'],
 ['linguistic','保留类','语言性（非文化性）翻译','Linguistic (non-cultural) translation','采用目标语中语言层面的对应表达，仍使读者识别源文化指称；不等同于所有“直译”。'],
 ['extraGloss','保留类','文外注释','Extratextual gloss','在正文外通过脚注、尾注等解释文化项。'],
 ['intraGloss','保留类','文内注释','Intratextual gloss','把解释性信息融入正文中。'],
 ['synonymy','替代类','同义替换','Synonymy','以同义或平行指称等方式替换表达，常用于避免重复。'],
 ['limitedUniversal','替代类','有限普遍化','Limited universalization','改用目标读者更易理解、但仍属于源文化的较常见指称。'],
 ['absoluteUniversal','替代类','绝对普遍化','Absolute universalization','改用文化指向较中性的一般表达，去除原项特定的文化指称。'],
 ['naturalization','替代类','归化','Naturalization','用目标文化系统中的特有对应项替换源文化项；不把一切流畅表达都称为归化。'],
 ['deletion','替代类','删除','Deletion','省去该文化项；需核查上下文，避免把未识别的对应译法误判为删除。'],
 ['creation','替代类','自主创造','Autonomous creation','译入原文中未出现的文化项；需要同时记录新增位置与判断依据，不等同于任何增译。']
];
function strategyEditor(t,k){let codes=Array.isArray(t[k+'StrategyCodes'])?t[k+'StrategyCodes']:[],legacy=t[k+'MethodLegacy']??(!codes.length?t[k+'Method']||'':'');return `<div class="strategy-editor"><h4>Aixélá 翻译策略</h4><small>可复选组合策略；如需统计总体取向，请指定主策略。</small>${['保留类','替代类'].map(group=>`<fieldset><legend>${group}</legend>${AIXELA.filter(s=>s[1]===group).map(([id,,label,en,desc])=>`<label class="strategy-option" title="${esc(en+'：'+desc)}"><input type="checkbox" name="${k}StrategyCodes" value="${id}" ${codes.includes(id)?'checked':''}>${label}</label>`).join('')}</fieldset>`).join('')}<label class="field">主策略（供互斥计数）<select name="${k}Primary"><option value="">未指定</option>${AIXELA.map(([id,g,l])=>`<option value="${id}" ${t[k+'Primary']===id?'selected':''}>${g} · ${l}</option>`).join('')}</select></label>${makeField(k+'AnnotationStatus','标注状态',t[k+'AnnotationStatus']||'待标注','select',['待标注','已标注','存疑','不适用'])}${makeField(k+'StrategyReason','标注依据：具体表达与源译文对应证据',t[k+'StrategyReason']||'','textarea')}${makeField(k+'Effect','效果分析：语境意义／文化信息／文学功能／法语表达',t[k+'Effect']||'','textarea')}${makeField(k+'Factors','差异解释：文本内外因素及 AI 生成条件',t[k+'Factors']||'','textarea')}${legacy?`<label class="field">旧版“翻译方法”记录（原样保留，尚不自动归类）<textarea name="${k}MethodLegacy" readonly>${esc(legacy)}</textarea></label>`:''}</div>`}

function docxParagraphText(p){let out='';function walk(n){if(n.nodeType!==1){for(let c of n.childNodes||[])walk(c);return}let name=n.localName;if(name==='t'){out+=n.textContent;return}if(name==='tab'){out+='\t';return}if(name==='br'){out+='\n';return}if(name==='footnoteReference'||name==='endnoteReference'){let id=n.getAttributeNS('http://schemas.openxmlformats.org/wordprocessingml/2006/main','id')||n.getAttribute('w:id');out+='['+(name==='footnoteReference'?'脚注':'尾注')+id+']';return}if(name==='del')return;for(let c of n.childNodes)walk(c)}walk(p);return out}

function columnRow(values,header){let obj={};for(let [i,k] of header.entries())if(k&&nonempty(values[i]))obj[k]=String(values[i]).trim();return obj}

function parseChapterValue(v){let s=String(v??'').trim().replace(/^第\s*/,'').replace(/\s*章$/,'');return /^\d+$/.test(s)&&Number(s)>=1&&Number(s)<=24?String(Number(s)):''}

 for(let [offset,r] of sheet.rows.slice(headerIndex+1).entries()){let row=columnRow(r,header),source=`${sheet.name}第${headerIndex+offset+2}行`;if(!row.word&&!row.id&&!row.number)continue;let match=resolveTerm(row,cat);if(match.error){issues.push(source+'：'+match.error);continue}let patch={};for(let [key] of termFields){if(!['word','number'].includes(key)&&nonempty(row[key]))patch[key]=row[key]}if(row.sourceContext)patch.sourceContext=row.sourceContext;for(let k of ['deep','gpt','human'])if(['待复核','已核对'].includes(row[k+'AlignmentReview']))patch[k+'AlignmentReview']=row[k+'AlignmentReview'];if(row.chapter){let n=parseChapterValue(row.chapter);if(n)patch.chapter=n;else issues.push(source+'：章节无效，未导入该章节值')}for(let k of ['deep','gpt','human'])if(patch[k+'Method']){let codes=findStrategyCodes(patch[k+'Method']);if(codes){patch[k+'StrategyCodes']=codes}else patch[k+'MethodLegacy']=patch[k+'Method']}incoming.push({term:match.term,patch,source})}

function renderChapterImport(){$('#import-tool').innerHTML=`<h3>从章节原文与三方译文识别</h3><div class="hint green">第一步导入整章 TXT／DOCX（也可直接粘贴）。工具自动寻找 278 项在中文原文中的位置；法语语义对齐可一次生成整批指令，再把模型返回的表格整体导入，不用逐条填写。</div><label class="field">导入到哪一章<select onchange="switchDraftChapter(Number(this.value))">${state.chapters.map(c=>`<option value="${c.id}" ${c.id===chapterDraft.chapter?'selected':''}>第 ${c.id} 章</option>`).join('')}</select></label><div class="pair">${[['source','中文原文'],['deep','DeepSeek 译文'],['gpt','GPT-6 译文'],['human','人工译本']].map(([k,n])=>`<div class="card"><div class="card-body"><label class="field">${n} · TXT／DOCX<input type="file" accept=".txt,.docx" onchange="readChapterFile(this,'${k}')"></label><textarea id="draft-${k}" aria-label="导入${n}" placeholder="导入文件或粘贴完整内容" oninput="chapterDraft.${k}=this.value">${esc(chapterDraft[k])}</textarea></div></div>`).join('')}</div><div class="toolbar"><button onclick="saveChapterDraft()">保存这四份正文到章节页</button><button class="primary" onclick="scanChapter()">① 自动识别中文词条与位置</button></div><small>这里不会自动调用 AI 或生成法译。TXT 支持 UTF-8／带标记的 UTF-16；DOCX 同时保留脚注、尾注及编号，图片和批注不识别。扫描版 PDF 和图片需先做文字识别后再导入。段落按本次输入的非空行计数，不冒充原版页码。</small><div id="chapter-scan"></div>`}
function switchDraftChapter(n){if(!confirm('切换章节会放弃当前未保存的导入草稿，继续？'))return renderChapterImport();let c=state.chapters.find(c=>c.id===n);chapterDraft={chapter:n,source:c.source,deep:c.deep,gpt:c.gpt,human:c.human};renderChapterImport()}
async function readChapterFile(input,k){let f=input.files[0];if(!f)return;if(f.size>15000000)return toast('文件超过 15 MB，请按章节拆分');try{chapterDraft[k]=/\.docx$/i.test(f.name)?await readDocx(f):await readUnicodeText(f);$('#draft-'+k).value=chapterDraft[k];toast('已读取 '+f.name+'，尚未写入章节')}catch(e){toast('文件读取失败：'+e.message)}}
async function saveChapterDraft(){let c=state.chapters.find(c=>c.id===chapterDraft.chapter),keys=['source','deep','gpt','human'].filter(k=>nonempty(chapterDraft[k])&&!same(c[k],chapterDraft[k]));if(!keys.length)return toast('没有需要保存的非空正文');if(!confirm(`将 ${keys.length} 份正文保存到第 ${c.id} 章？已有非空正文会更新并保留章节快照。`))return;let before=clone(state);try{state.history.unshift({id:uid(),type:'chapter',chapter:c.id,at:stamp(),data:clone(c)});for(let k of keys)c[k]=chapterDraft[k];c.updatedAt=stamp();await persist();toast('正文已保存。可以继续识别词条。')}catch(e){state=before;toast('保存失败：'+e.message)}}
function frenchSentences(text){if(typeof Intl.Segmenter==='function')return Array.from(new Intl.Segmenter('fr',{granularity:'sentence'}).segment(text),s=>s.segment.trim()).filter(Boolean);return String(text).split(/(?<=[.!?。！？])\s+/).filter(Boolean)}
function scanChapter(){if(!chapterDraft.source.trim())return toast('请先导入或粘贴中文原文');let paras=chapterDraft.source.split('【文外注释：')[0].split(/\r?\n/).map(p=>p.trim()).filter(Boolean);chapterHits=[];for(let t of state.terms){let matches=[];for(let [index,p] of paras.entries())if(normalText(p).includes(normalText(t.word)))matches.push({index:index+1,text:p});if(matches.length)chapterHits.push({term:t,matches})}
 $('#chapter-scan').innerHTML=`<div class="hint">按文字匹配识别到 ${chapterHits.length} 个条目（包括不同类别下的同名词）；其余 ${state.terms.length-chapterHits.length} 项在本章未按完整词形匹配。匹配不会判定文化含义或翻译策略。分隔词、别称、异体字可在对齐会话补充核查。</div><div class="table-wrap import-preview"><table><thead><tr><th>词条</th><th>本次输入的位置</th><th>中文语境（展开）</th></tr></thead><tbody>${chapterHits.map(h=>`<tr><td>${esc(h.term.category)} · ${esc(h.term.number)}<br><b>${esc(h.term.word)}</b></td><td>第 ${chapterDraft.chapter} 章·输入第 ${h.matches.map(m=>m.index).join('、')} 段</td><td><details><summary>${h.matches.length} 个段落</summary>${h.matches.map(m=>`<pre>${esc(m.text)}</pre>`).join('')}</details></td></tr>`).join('')}</tbody></table></div><div class="toolbar"><button ${chapterHits.length?'':'disabled'} onclick="previewChapterLocations()">预览并批量保存中文定位</button><button class="primary" ${chapterHits.length?'':'disabled'} onclick="makeAlignmentPrompt()">② 生成整章批量对齐指令</button></div><div class="hint">未知的法语对应词无法只靠本地文字查找可靠识别。批量对齐指令用于你已经得到的译文，请在独立的“对齐会话”使用，不作为正式翻译指令；机器返回结果需复核。工具会校验返回译法与法语句子是否确实存在于你提供的译文中，但这不等于已验证语义对应。</div><div id="alignment-step"></div>`}
function previewChapterLocations(){let rows=chapterHits.map(h=>{let patch={chapter:String(chapterDraft.chapter),position:`第${chapterDraft.chapter}章·本次输入第${h.matches.map(m=>m.index).join('、')}段（按非空行）`,sourceContext:h.matches.map(m=>m.text).join('\n')};for(let k of ['deep','gpt','human'])if(nonempty(h.term[k])&&chapterDraft[k]){let sentences=frenchSentences(chapterDraft[k]).filter(s=>quoteText(s).includes(quoteText(h.term[k])));if(sentences.length===1){patch[k+'Sentence']=sentences[0];patch[k+'AlignmentReview']='待复核'}}return {term:h.term,patch,source:'第'+chapterDraft.chapter+'章文字匹配'}});importSession={rows,issues:['只保存中文位置、语境及已知法译的字面匹配句，不推断未知译法，不自动标注 Aixélá 策略。'],source:'第'+chapterDraft.chapter+'章定位识别',mode:'fill',type:'chapter-locate',chapterSource:clone(chapterDraft)};renderImportPreview()}
function makeAlignmentPrompt(){let header=['分类','序号','中文原文','原文位置',...termFields.slice(3).map(c=>c[1]),'关联章节'];let target=chapterHits.map(h=>[h.term.category,h.term.number,h.term.word,'第'+chapterDraft.chapter+'章·输入第'+h.matches.map(m=>m.index).join('、')+'段'].join('\t')).join('\n');let prompt=`任务：只对齐已经存在的译文，不重新翻译、不改写、不补造；不要把注释或释义中的词语冒充译文正文。请处理第 ${chapterDraft.chapter} 章以下全部目标词条，并输出可粘贴到 Excel 的 TSV 表格。\n规则：\n1. 文化类别、原序号和中文词形原样保留。同名条目不得合并。\n2. 逐项定位中文语境，在 DeepSeek、GPT 和人工译本中找对应法语表达，并摘录包含该表达的完整法语句子。所有法语内容必须从下列现有译文逐字摘录，保留变音符号与标点，不做新翻译。\n3. 无法确定、缺译、同词多义无法区分、或对应跨句时，相关译法和原句字段留空，并在表格之后另列异常说明，不能猜测。\n4. 三个主体的中文释义、Aixélá 策略列先留空，由研究者后续判断，不把你的解释当作研究结论。\n5. 只在 TSV 中使用下列表头顺序；单元格里的换行改为空格，不要合并单元格。每个目标条目一行。\n表头：\n${header.join('\t')}\n\n目标条目（分类／原序号／词形／中文位置）：\n${target}\n\n【中文原文】\n${chapterDraft.source}\n\n【DeepSeek 已有译文】\n${chapterDraft.deep}\n\n【GPT 已有译文】\n${chapterDraft.gpt}\n\n【人工已有译本】\n${chapterDraft.human}`;
 $('#alignment-step').innerHTML=`<h3>复制到独立的对齐会话，一次处理本章词条</h3><label class="field">完整对齐指令<textarea id="alignment-prompt" readonly>${esc(prompt)}</textarea></label><div class="toolbar"><button onclick="copyAlignmentPrompt()">复制全部指令</button><button onclick="download('第${chapterDraft.chapter}章-批量对齐指令.txt',document.querySelector('#alignment-prompt').value)">下载指令 TXT</button></div><label class="field">③ 粘贴模型返回的整张 TSV 表（可包含代码块）<textarea id="alignment-result" placeholder="粘贴带表头的批量对齐结果…"></textarea></label><button class="primary" onclick="readAlignmentResult()">校验原句并预览批量导入</button><small>你无需逐条输入；批量选择后确认导入。内容存在性校验不证明语义对齐正确，导入项会标记“待复核”。</small>`}
async function copyAlignmentPrompt(){let text=$('#alignment-prompt').value;try{await navigator.clipboard.writeText(text);toast('整章对齐指令已复制')}catch(e){$('#alignment-prompt').select();toast('请按 Command+C 复制选中的完整指令')}}
function readAlignmentResult(){try{let text=$('#alignment-result').value;if(!text.trim())return toast('请先粘贴批量对齐结果');let plan=planImport([{name:'第'+chapterDraft.chapter+'章AI对齐',rows:parseDelimited(text)}]);plan.rows=plan.rows.filter(row=>{if(chapterHits.some(h=>h.term.id===row.term.id))return true;plan.issues.push(row.term.word+'：不在本章识别目标中，未导入');return false});for(let row of plan.rows){let hit=chapterHits.find(h=>h.term.id===row.term.id);row.patch.position='第'+chapterDraft.chapter+'章·本次输入第'+hit.matches.map(m=>m.index).join('、')+'段（按非空行）';row.patch.sourceContext=hit.matches.map(m=>m.text).join('\n');row.patch.chapter=String(chapterDraft.chapter);for(let k of ['deep','gpt','human']){for(let suffix of ['Method','MethodLegacy','StrategyCodes','Primary','AnnotationStatus','StrategyReason','Effect','Factors','Meaning'])delete row.patch[k+suffix];let txt=chapterDraft[k],value=row.patch[k],sentence=row.patch[k+'Sentence'];if(!value&&!sentence)continue;let errors=[];if(!txt.trim())errors.push('未提供该主体的完整译文');if(value&&!quoteText(txt).includes(quoteText(value)))errors.push('对应译法不在提供的译文中');if(sentence&&!quoteText(txt).includes(quoteText(sentence)))errors.push('原句不在提供的译文中');if(value&&sentence&&!quoteText(sentence).includes(quoteText(value)))errors.push('译法不在对应句子内');if(errors.length){delete row.patch[k];delete row.patch[k+'Sentence'];plan.issues.push(row.term.word+' · '+k+'：'+errors.join('；')+'，该主体结果未导入')}else {if(sentence){let whole=frenchSentences(txt).filter(s=>quoteText(s).includes(quoteText(sentence)));if(whole.length===1)row.patch[k+'Sentence']=whole[0]}if(value&&!sentence){let sentences=frenchSentences(txt).filter(s=>quoteText(s).includes(quoteText(value)));if(sentences.length===1)row.patch[k+'Sentence']=sentences[0]}row.patch[k+'AlignmentReview']='待复核'}}}
 importSession={...plan,source:'第'+chapterDraft.chapter+'章AI批量对齐（存在性校验后）',mode:'fill',type:'assisted-alignment',chapterSource:clone(chapterDraft)};renderImportPreview()}catch(e){toast('识别失败：'+e.message)}}
</script><script>const LESSONS=[
{title:'先建立整体认识',summary:'把预训练、提示词、上下文和输出串成一个过程。',body:`<h2>模型怎样把一章中文变成法语？</h2><p>大语言模型通常把输入文字编码成 token，依据已有参数和当前上下文计算下一个 token 的概率，逐步生成输出。你的翻译要求、人工译文示例和前面的对话，都会成为本次生成的条件；输出并不是简单地逐词查字典。</p><div class="hint green">已有参数 ＋ 当前指令 ＋ 示例与正文 → 条件概率分布 → 逐步解码 → 法语输出。</div><h3>研究时先分清三个层次</h3><ul><li><b>已有能力：</b>来源于模型训练，普通网页用户无法完整观察训练数据或参数。</li><li><b>当次条件：</b>模型实际收到的提示词、示例、正文、会话历史和工具结果。</li><li><b>可见结果：</b>完整原始输出；如果有可见解释，应保留，但解释不等于内部计算过程的完整记录。</li></ul><p>本平台不连接模型。你在对应模型界面完成实验后，把实际指令和输出记录回来。</p>`,sources:[['Transformer 原始论文（2017）','https://arxiv.org/abs/1706.03762']]},
{title:'模型的学习方式',summary:'预训练、微调、偏好对齐与示例引导的差别。',body:`<h2>“学习”可能指四件不同的事</h2><ul><li><b>预训练：</b>通常通过大规模数据上的预测目标优化模型参数，形成语言和任务能力。</li><li><b>监督微调：</b>用任务示例继续优化参数。它需要训练流程，不能仅凭聊天中一句“请学习”就认定已发生。</li><li><b>偏好对齐：</b>通过人类或其他反馈调整模型的行为倾向；具体方法和实现依模型而异。</li><li><b>上下文学习：</b>在输入中提供示例，使模型在后续任务中参照其模式；通常不在这次对话中更新基础模型权重。</li></ul><div class="hint">你准备的“先看人工翻译方法，再翻译”，若通过普通聊天界面进行，通常应记录为“示例引导／上下文学习条件”。除非确实调用了训练流程，不应在论文里直接称为“对模型进行了微调”。</div><h3>还需要区分记忆</h3><p>产品可能另有跨会话记忆或项目资料检索功能。这些功能可以改变送入模型的上下文，但不是基础模型已经被你训练。是否启用、是否参与本次输入应按实际情况记录。</p>`,sources:[['上下文学习：Language Models are Few-Shot Learners（2020）','https://arxiv.org/abs/2005.14165'],['偏好对齐：Training language models to follow instructions with human feedback（2022）','https://arxiv.org/abs/2203.02155']]},
{title:'运行与生成方式',summary:'token、注意力、解码与上下文限制。',body:`<h2>一次生成里面发生什么？</h2><ol><li>输入按词表编码成 token。token 不一定是一个完整汉字或单词。</li><li>许多现代语言模型使用 Transformer 结构，通过注意力等机制处理上下文中的关系。具体模型结构应以对应版本的技术资料为准。</li><li>模型给出下一 token 的条件概率，解码算法选取 token，再继续生成，直到结束条件或输出限制。</li></ol><h3>为什么同一指令可能给出不同译文？</h3><p>随机采样参数、模型版本、会话输入差异和运行实现都可能影响结果。网页端通常不暴露所有设置；未知项应写“不可获取”，不要假定 temperature 为某个值。即便设置了低随机性，也不要承诺跨版本完全相同。</p><h3>长章节怎样处理？</h3><p>上下文长度和输出长度都有上限；还要给指令、示例、历史对话留空间。观察漏译、截断和结束位置。必须分段时，保存各次实际输入、分段位置、前后文与轮次；不要将拼接结果描述成一次完整生成。</p>`,sources:[['Attention Is All You Need（2017）','https://arxiv.org/abs/1706.03762']]},
{title:'思考模式与联网',summary:'界面模式并非可直接观察的全部内部原理。',body:`<h2>思考模式能说明什么？</h2><p>界面显示的“思考”“深度思考”等模式，是产品提供的运行选项。不同产品、版本的含义可能不同，应记录实际模型名称、模式、时间和渠道。不能仅凭按钮名称断言模型采用了某种内部算法，或声称知道它完整的内部思维过程。</p><h3>解释不等于事实证明</h3><p>模型可能对自己的译法给出流畅解释，但解释可以出错，也不构成你标注“意译”“音译”“文化补偿”的直接证据。策略应由研究者结合源文、译文与标注准则判断。</p><h3>联网和检索</h3><p>如果开启搜索、知识库或项目文件，模型可能收到额外检索材料。它们是额外输入条件，不代表已重新训练模型。对比实验应记录是否启用，以及能看到的实际来源；尽量保持两个主体条件可比。</p><div class="hint">原表“Deepseek V3.2 深度思考模式”“GPT-6 思考模式”在本平台仅作为你提供的研究列标签，不代表平台已核实当前产品可选模型、模式或架构。</div>`,sources:[['Chain-of-Thought Prompting Elicits Reasoning in Large Language Models（2022；提示方法研究，不等同于产品内部原理）','https://arxiv.org/abs/2201.11903']]},
{title:'你的学习—翻译流程',summary:'怎样安排示例材料，避免把实验条件混在一起。',body:`<h2>建议把一章分成三个阶段记录</h2><ol><li><b>人工译法学习：</b>保存学习指令、原文与人工译文示例、示例来源以及模型学习后的原始反馈。</li><li><b>学习反馈／方法总结：</b>如果你要求它总结方法，另记该次指令与完整输出。不要把它的自我描述直接变成你的策略结论。</li><li><b>正式翻译：</b>明确只输入待译原文，保存实际翻译指令、完整中文、输出及轮次，并说明是否沿用学习对话。</li></ol><div class="hint">若把同一测试章节的完整人工译文先给模型，再让它翻译该章，结果反映的是“已见目标译文”的条件，不能当作未见参照译文的独立翻译表现。可以研究这种条件，但应如实标明。</div><h3>如果要研究方法迁移</h3><p>可用与测试章节分开的示例作为学习材料，并给两个模型相同示例、相同指令和相同语境。比较“无示例”与“有示例”时，分组记录，避免把两种条件合并统计。</p><h3>每章最少记录什么？</h3><p>实际模型与模式、学习材料、完整指令、完整输入、第一次完整输出、是否沿用会话，以及每一次追问／重试。右侧指令记录就是这些信息的存放位置。</p>`,sources:[['示例引导基础：Language Models are Few-Shot Learners（2020）','https://arxiv.org/abs/2005.14165']]},
{title:'三译本分析与核查',summary:'从词条对照到研究者的策略标注。',body:`<h2>把可观察结果和研究判断分开</h2><p>词条页保留你的表格框架：目标词法译、中文释义、翻译方法、完整译文原句。建议先核对词语实际落在译文何处，再判断策略；多对一、省译、拆分和跨句处理都应按实际语境记录。</p><h3>一套可复核的标注流程</h3><ol><li>确认原文位置、完整中文语境和对应法语句子。</li><li>摘录真实译法；没有明确对应时如实记“未找到对应”并说明，不自行替模型补译。</li><li>依据 Aixélá 的保留／替代两类及具体策略填写标注；可记录组合策略并指定用于互斥统计的主策略，保留边界案例说明。</li><li>如条件允许，用第二位标注者独立复核部分语料，报告分歧与一致性处理。</li></ol><h3>机器翻译评价的边界</h3><p>BLEU 等自动指标衡量与参考译文的表面匹配程度，不能单独证明文化信息保留或翻译优劣。文化负载词研究仍需要语境分析和透明的标注准则。</p>`,sources:[['BLEU: a Method for Automatic Evaluation of Machine Translation（2002）','https://aclanthology.org/P02-1040/']]}
];
function renderLearning(){let l=LESSONS[lessonIndex],note=state.notes[lessonIndex]||{text:'',done:false},done=Object.values(state.notes).filter(n=>n.done).length;$('#app').innerHTML=heading('机器翻译原理 · 学习手册','从基本原理到你的实验流程，学习内容与个人笔记放在一起。')+`<div class="lesson-layout"><div class="card lesson-nav"><div class="card-top"><h3>学习路线 ${done}/${LESSONS.length}</h3></div><div class="card-body">${LESSONS.map((l,i)=>`<button class="${i===lessonIndex?'primary':''}" onclick="lessonIndex=${i};renderLearning()">${state.notes[i]?.done?'✓':String(i+1).padStart(2,'0')}　${l.title}</button>`).join('')}</div></div><div><article class="card lesson"><div class="card-body"><span class="chip">第 ${lessonIndex+1} 节 · ${esc(l.summary)}</span>${l.body}<h3>进一步阅读</h3><ul>${l.sources.map(([name,url])=>`<li><a href="${url}" target="_blank" rel="noopener noreferrer">${esc(name)} ↗</a></li>`).join('')}</ul><small>以上为通用原理与研究方法概述；具体产品的模型架构、训练和运行细节，应以实际版本公开资料为准。</small></div></article><div class="card"><div class="card-top"><h3>我的学习笔记</h3><label><input type="checkbox" ${note.done?'checked':''} onchange="updateNote('done',this.checked)"> 已学习</label></div><div class="card-body"><textarea aria-label="我的学习笔记" placeholder="用自己的话记录原理、疑问，以及对当前章节实验的启发…" oninput="updateNote('text',this.value)">${esc(note.text)}</textarea><small>笔记自动保存，并包含在全部 JSON 备份中。</small></div></div></div></div>`}
